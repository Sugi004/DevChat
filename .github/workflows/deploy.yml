name: Deploy TalkFlow Backend

on:
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            echo "Deploying DevChat backend..."
            cd ~/DevChat
            git pull origin main
            docker rm -f devchat
            docker build -t devchat-backend ./backend --no-cache
            docker run -d \
              --name devchat \
              --network devchat-network \
              -p 8001:8000 \
              --env-file ./backend/.env \
              --restart always \
              devchat-backend
            docker logs devchat
            FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true
