services:
  - type: web
    name: TalkFlow
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: false
    healthCheckPath: /healthz
    envVars:
      - key: IS_PRODUCTION
        value: "true"
      - key: DATABASE_SSL
        value: auto
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_PUBLIC_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: MESSAGE_ENCRYPTION_KEY
        sync: false
      - key: PASSWORD_ENCRYPTION_PRIVATE_KEY
        sync: false
      - key: EMAIL_DELIVERY_MODE
        value: auto
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
